<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGym - Tarification électrique</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Work Sans', 'Segoe UI', sans-serif;
      background-image: url('/static/img/bg_greengym.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #1e3f3f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.75);
      padding: 50px;
      max-width: 900px;
      width: 94%;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 0.7s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      color: #2d8f6f;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-weight: 500;
      margin-bottom: 6px;
    }

    select, input[type="number"], input[type="text"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1em;
      width: 100%;
    }

    .btn {
      background-color: #2d8f6f;
      color: white;
      padding: 12px 30px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 128, 96, 0.15);
      transition: background-color 0.3s ease, transform 0.2s ease;
      align-self: flex-end;
    }

    .btn:hover {
      background-color: #246f58;
      transform: translateY(-2px);
    }

    .inline-field {
      display: flex;
      flex-direction: column;
    }

    #champs_tarif > div {
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .box {
        padding: 30px 20px;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>

  <script>
    function genererTranches(devise = "€") {
      const nb = parseInt(document.getElementById("nb_tranches").value);
      const container = document.getElementById("tranches_inputs");
      container.innerHTML = "";

      for (let i = 0; i < nb; i++) {
        const bloc = document.createElement("div");
        bloc.classList.add("grid-2col");

        bloc.innerHTML = `
          <div class="inline-field">
            <label>Tranche ${i + 1} (limite kWh) :</label>
            <input type="number" name="tranche_limite[]" step="1" required>
          </div>
          <div class="inline-field">
            <label>Tarif (${devise}/kWh) :</label>
            <input type="number" name="tranche_tarif[]" step="0.01" required>
          </div>
        `;

        container.appendChild(bloc);
      }
    }

    function afficherChampsTarification() {
      const type = document.getElementById("type_tarif").value;
      const devise = document.getElementById("devise")?.value || "€";
      const container = document.getElementById("champs_tarif");
      container.innerHTML = "";

      if (type === "forfait") {
        container.innerHTML = `
          <div class="inline-field">
            <label>Prix annuel (${devise}) :</label>
            <input type="number" name="prix_annuel" min="0" step="0.01" required>
          </div>
        `;
      } else if (type === "tranches") {
        container.innerHTML = `
          <div class="inline-field">
            <label>Nombre de tranches :</label>
            <input type="number" id="nb_tranches" min="1" required onchange="genererTranches('${devise}')">
          </div>
          <div id="tranches_inputs" style="margin-top: 15px;"></div>
        `;
      } else if (type === "heures") {
        container.innerHTML = `
          <div class="inline-field">
            <label>Tarif heures pleines (${devise}/kWh) :</label>
            <input type="number" name="tarif_hp" step="0.01" required>
          </div>
          <div class="inline-field">
            <label>Tarif heures creuses (${devise}/kWh) :</label>
            <input type="number" name="tarif_hc" step="0.01" required>
          </div>
        `;
      } else if (type === "abonnement") {
        container.innerHTML = `
          <div class="inline-field">
            <label>Prix abonnement annuel (${devise}) :</label>
            <input type="number" name="abonnement_annuel" step="0.01" required>
          </div>
          <div class="inline-field">
            <label>Tarif consommation (${devise}/kWh) :</label>
            <input type="number" name="tarif_conso" step="0.01" required>
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const selectTarif = document.getElementById("type_tarif");
      const selectDevise = document.getElementById("devise");
      if (selectTarif && selectDevise) {
        selectTarif.addEventListener("change", afficherChampsTarification);
        selectDevise.addEventListener("change", afficherChampsTarification);
        afficherChampsTarification();
      }
    });
  </script>
</head>

<body>
  <div class="box">
    <h2>💰 Tarification électrique</h2>
    <form method="POST" id="tarificationForm">
      <div class="inline-field">
        <label for="devise">Devise utilisée :</label>
        <select name="devise" id="devise" required>
          <option value="€">Euro (€)</option>
          <option value="$">Dollar ($)</option>
          <option value="MAD">Dirham (MAD)</option>
          <option value="£">Livre (£)</option>
        </select>
      </div>

      <div class="inline-field">
        <label for="type_tarif">Type de tarification :</label>
        <select name="type_tarif" id="type_tarif" required>
          <option value="">-- Choisir --</option>
          <option value="forfait">Forfait fixe</option>
          <option value="tranches">Par tranches</option>
          <option value="heures">Heures pleines / creuses</option>
          <option value="abonnement">Abonnement + consommation</option>
        </select>
      </div>

      <div id="champs_tarif" style="margin-top: 20px;"></div>

      <button type="submit" class="btn" style="margin-top: 25px;">Étape suivante ➡️</button>
    </form>
  </div>
</body>
</html>
