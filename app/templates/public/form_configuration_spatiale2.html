<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGym - Configuration spatiale (existante)</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Work Sans', sans-serif;
      background-image: url('/static/img/bg_greengym.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #1e3f3f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.75);
      padding: 50px;
      max-width: 720px;
      width: 90%;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 0.7s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
        text-align: center;
        color: #2d8f6f;
        margin-top: 0px;
        margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-weight: 500;
      color: #333;
    }

    input[type="number"] {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1em;
      transition: border-color 0.3s ease;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #2d8f6f;
      box-shadow: 0 0 5px rgba(45, 143, 111, 0.3);
    }

    button {
      margin-top: 30px;
      align-self: flex-end;
      background-color: #2d8f6f;
      color: white;
      padding: 12px 30px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 128, 96, 0.15);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #246f58;
      transform: translateY(-2px);
    }

    @media (max-width: 500px) {
      .box {
        padding: 30px 20px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>🏠 Configuration spatiale de la salle</h2>
    <form method="POST">
      <label>Surface totale (m²)</label>
      <input type="number" name="surface_totale" step="0.1" required>

      <label>Surface cardio (m²)</label>
      <input type="number" name="surface_cardio" step="0.1" required>

      <label>Surface pavés piézo prévue (m²)</label>
      <input type="number" name="surface_piezo" step="0.1" required>

      <label>Surface zones dynamiques estimée (m²)</label>
      <input type="number" name="surface_dynamiques" step="0.1" required>

      <button type="submit">Étape suivante ➡️</button>
    </form>
  </div>
</body>
</html>
