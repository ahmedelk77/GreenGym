<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGym - Objectifs</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Work Sans', sans-serif;
      background-image: url('/static/img/bg_greengym.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #1e3f3f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.75);
      padding: 50px;
      max-width: 700px;
      width: 90%;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 0.7s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
        text-align: center;
        color: #2d8f6f;
        margin-top: 0px;
        margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-size: 1.05em;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #333;
      background-color: #f9fdfc;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: background-color 0.3s ease;
    }

    label:hover {
      background-color: #f0fcf7;
    }

    input[type="checkbox"] {
      accent-color: #2d8f6f;
      transform: scale(1.2);
    }

    button {
      margin-top: 30px;
      align-self: flex-end;
      background-color: #2d8f6f;
      color: white;
      padding: 12px 30px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 128, 96, 0.15);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #246f58;
      transform: translateY(-2px);
    }

    @media (max-width: 500px) {
      .box {
        padding: 30px 20px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Quels sont vos objectifs principaux ?</h2>
    <form method="POST">
      <label>
        <input type="checkbox" name="objectifs" value="eco">
        Réduction des coûts
      </label>
      <label>
        <input type="checkbox" name="objectifs" value="green">
        Transition écologique
      </label>
      <label>
        <input type="checkbox" name="objectifs" value="faisabilite">
        Étude de faisabilité
      </label>
      <button type="submit">Continuer</button>
    </form>
  </div>
</body>
</html>
